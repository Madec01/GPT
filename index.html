<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#061c26">
  <meta name="description" content="ABYSSE — Une expédition sous-marine. Explorez, récupérez et écoutez ce qui vit sous la surface.">
  <title>ABYSSE · Le silence répond</title>
  <link rel="icon" href="assets/graphics/gem.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/abysse.css">
</head>
<body>
  <canvas id="ocean" aria-label="Vue de l’expédition sous-marine"></canvas>
  <div class="grain" aria-hidden="true"></div>
  <div id="loading" class="loading"><span class="eyebrow">EXPÉDITION / 20 ANS DE SILENCE</span><h1>ABYSSE</h1><div class="loading-line"></div><p id="load-status" role="status">Mise à l’eau des instruments…</p></div>
  <header id="masthead"><a href="#" id="brand" aria-label="Accueil ABYSSE">ABYSSE<span>LE SILENCE RÉPOND</span></a><div class="mast-right"><span class="signal-dot"></span><span id="connection">LIAISON SURFACE</span><button id="sound-toggle" class="tiny" aria-label="Couper le son">SON ACTIVÉ</button></div></header>
  <main id="screen" hidden></main>
  <section id="hud" hidden aria-label="Instruments de plongée">
    <div class="hud-top"><div><span id="sector-label" class="eyebrow"></span><h2 id="objective-title"></h2><p id="objective-detail"></p></div><button id="pause-button" class="small-button">Pause <kbd>Échap</kbd></button></div>
    <div class="instruments"><div class="instrument"><label>COQUE <b id="hull-text">100</b></label><div class="meter"><i id="hull-meter"></i></div></div><div class="instrument"><label>ÉNERGIE <b id="energy-text">100</b></label><div class="meter energy"><i id="energy-meter"></i></div></div><div class="depth"><b id="depth">000</b><span> MÈTRES</span></div></div>
    <div id="radio" role="status"><span class="eyebrow" id="radio-speaker">SURFACE</span><p id="radio-text"></p></div>
    <div id="context-action"></div><div id="toast" role="status"></div>
    <div class="bottom-hud"><div class="control-hint"><span>PILOTER</span><kbd>ZQSD / WASD / ↑↓←→</kbd><span>POUSSÉE</span><kbd>Maj</kbd></div><div class="tools"><button data-tool="sonar"><kbd>Espace</kbd><span>Sonar</span><small id="sonar-state">PRÊT</small></button><button data-tool="light"><kbd>L</kbd><span>Phare</span><small id="light-state">ALLUMÉ</small></button><button data-tool="interact"><kbd>E</kbd><span>Treuil / activer</span><small id="tether-state">LIBRE</small></button><button data-tool="cut"><kbd>F</kbd><span>Découper</span><small>MAINTENIR</small></button></div><span id="test-badge" hidden>MODE TEST<br>RECORDS DÉSACTIVÉS</span></div>
  </section>
  <div id="modal" hidden role="dialog" aria-modal="true" aria-label="Menu"></div>
  <footer id="footer"><span>UN SIGNAL. UNE DESCENTE. UN CHOIX.</span><span>CLAVIER · CASQUE CONSEILLÉ</span></footer>
  <noscript>ABYSSE nécessite JavaScript. Activez-le pour lancer l’expédition.</noscript>
  <script type="module" src="js/abysse/app.js"></script>
</body>
</html>
