name: Game quality assurance

on:
  push:
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browsers:
    name: Unit tests and ${{ matrix.browser }} smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, msedge]
    steps:
      - name: Check out game
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run complete simulation, campaign and storage tests
        run: npm test
      - name: Install pinned browser driver
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install browser and system dependencies
        run: npx playwright install --with-deps "${{ matrix.browser }}"
      - name: Play through the browser interface
        env:
          SMOKE_BROWSER: ${{ matrix.browser }}
        run: node scripts/browser-smoke.mjs
      - name: Keep screenshots, trace and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
