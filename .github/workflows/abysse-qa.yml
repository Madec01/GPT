name: ABYSSE quality assurance

on:
  push:
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browsers:
    name: ABYSSE simulation and ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, msedge]
    steps:
      - name: Check out game
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify simulation and campaign
        run: |
          npm test
          node scripts/abysse/verify-campaign.mjs
      - name: Install pinned Playwright driver
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install browser and system dependencies
        run: npx playwright install --with-deps "${{ matrix.browser }}"
      - name: Exercise public UI with real WebGL rendering
        env:
          SMOKE_BROWSER: ${{ matrix.browser }}
          LIBGL_ALWAYS_SOFTWARE: '1'
          QA_HEADED: '1'
        run: xvfb-run -a node scripts/abysse/browser-smoke.mjs
      - name: Preserve screenshots, trace and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abysse-qa-${{ matrix.browser }}
          path: test-results/abysse/
          if-no-files-found: warn
          retention-days: 14
